name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: npx playwright install-deps

      - name: Start database containers
        run: |
          docker compose up -d --wait postgres mysql mariadb mongodb redis clickhouse
          docker compose run --rm redis-seed

      - name: Verify database connectivity
        run: |
          sqlite3 docker/sqlite/zequel.db "SELECT 'sqlite:ok', count(*) FROM customers"
          docker compose exec -T mongodb mongosh --quiet -u zequel -p zequel --authenticationDatabase admin zequel --eval "print('mongodb:ok ' + db.customers.countDocuments())"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" npx playwright test
        env:
          ELECTRON_ENABLE_LOGGING: 1

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down -v
