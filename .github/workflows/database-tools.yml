name: Database tools
on:
  pull_request:
    paths:
      - 'scripts/database-tools/**'
      - 'src/**'
      - 'electron.vite.config.ts'
      - 'package*.json'
      - '.nvmrc'
      - '.github/workflows/database-tools.yml'
  workflow_dispatch:
concurrency:
  group: database-tools-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      ZEQUEL_PACKAGE_ARCH: ${{ matrix.os == 'windows-11-arm' && 'x64' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          architecture: ${{ matrix.os == 'windows-11-arm' && 'x64' || (runner.arch == 'ARM64' && 'arm64' || 'x64') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex pkg-config libssl-dev zlib1g-dev liblz4-dev libzstd-dev patchelf cmake libaio1t64 libncurses6 libncurses-dev libtinfo6 libgtk-3-0 libnss3 libasound2t64 libsecret-1-0 dbus-x11 gnome-keyring xvfb
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: tools-cache
        with:
          path: resources/database-tools
          key: database-tools-${{ matrix.os }}-${{ hashFiles('scripts/database-tools/prepare-*.py', 'scripts/database-tools/*-sources.json', 'scripts/database-tools/windows-runtime.py', 'scripts/database-tools/verify-bundle.cjs', 'scripts/database-tools/licenses/**') }}
      - run: npm run tools:prepare
        id: prepare-tools
      - uses: actions/cache/save@v4
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: resources/database-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - run: npm run build
      - name: Package with verified client bundle
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged clients and file database round trips
        run: python scripts/database-tools/smoke-packaged.py
      - uses: actions/upload-artifact@v4
        with:
          name: database-tools-manifest-${{ matrix.os }}
          path: resources/database-tools/*/manifest.json
